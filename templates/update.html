{% extends 'base.html' %}
{% block title %}
  Home
{% endblock title %}
   
       {% block body %}
        
      


      <div class="container" style = "max-width: 1100px;">
        <div class="container my-3 mx-0">
          <h2>Update Your Todo</h2>
        </div>
      <form action = '/update/{{todo.sno}}' ,  method = "POST">
        <div class="mb-3 my-3">
          <label for="title" class="form-label">Title</label>
          <input type="text" class="form-control" name="title" value="{{todo.title}}" id="title" aria-describedby="emailHelp">
          <div id="emailHelp" class="form-text">edit / update</div>
        </div>
        <div class="mb-3">
          <label for="desc" class="form-label">Description</label>
          <input type="text" class="form-control" value="{{todo.desc}}" name = "desc" id="desc">
        </div>
        <button type="submit" class="btn btn-primary">Update</button>
      </form>
      </div>




    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
